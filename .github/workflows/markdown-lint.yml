name: Markdown Lint

on:
  push:
    paths:
      - "pages/**/*.md"
      - ".markdownlint.jsonc"
      - ".github/workflows/markdown-lint.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "pages/**/*.md"
      - ".markdownlint.jsonc"
      - ".github/workflows/markdown-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Rules are configured in .markdownlint.jsonc (also used by the VS Code markdownlint extension).
      # To fix most findings locally: npx markdownlint-cli2 --fix "pages/**/*.md"
      - name: Lint Markdown pages
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "pages/**/*.md"
